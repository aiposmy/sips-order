<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIPS Admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1F3D32">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="outlet.css">
<link rel="stylesheet" href="admin.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body class="outlet admin">
<header class="band">
  <div class="wrap">
    <img class="logo" src="logo.png" alt="SIPS Barley &amp; Comfort">
    <span class="tag">Admin</span>
    <span id="who" class="who-chip" hidden></span>
  </div>
</header>
<div class="banner" id="banner" hidden><div class="wrap" id="bannerText"></div></div>

<main id="login" class="wrap" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <h1>Log masuk admin</h1>
    <p class="sub">Laporan jualan dan urus produk. Hanya akaun berperanan <b>admin</b>.</p>
    <label class="field"><span>Emel</span><input type="text" id="lEmail" autocomplete="username" inputmode="email"></label>
    <label class="field"><span>Kata laluan</span><input type="password" id="lPw" autocomplete="current-password"></label>
    <div class="err" id="lErr" hidden></div>
    <button class="btn" id="lBtn" style="width:100%;margin-top:16px">Log masuk</button>
  </form>
</main>

<div id="app" hidden>
  <nav class="atabs wrap" aria-label="Bahagian admin">
    <button data-tab="laporan">Laporan</button>
    <button data-tab="produk">Produk</button>
    <button data-tab="kategori">Kategori &amp; pilihan</button>
    <button data-tab="shift">Shift</button>
    <button data-tab="order">Order</button>
    <button data-tab="aktiviti">Aktiviti</button>
  </nav>
  <main id="view" class="wrap"></main>
</div>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { OUTLET, PAYMENTS, LOYALTY } from "./config.js";
import { LIVE, today, staffWatch, staffLogin, staffLogout, watchMenu, buildMenu, saveMenuItem, deleteMenuItem, importDefaultMenu,
  getCosts, saveCosts, ordersInRange, shiftsInRange, voidOrder, auditInRange, logAudit, watchShift } from "./data.js";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r2 = n => Math.round(n * 100) / 100;
const rm = n => "RM" + (Math.round(n * 100) / 100).toLocaleString("en-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = n => isFinite(n) ? (Math.round(n * 10) / 10).toFixed(1) + "%" : "—";
const pad3 = n => String(n).padStart(3, "0");
const tm = t => new Date(t).toLocaleTimeString("ms-MY", { hour: "2-digit", minute: "2-digit", hour12: false });
const dtm = t => new Date(t).toLocaleString("ms-MY", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false });
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? r2(n) : NaN; };
const PAY = Object.fromEntries(PAYMENTS.map(p => [p.id, p]));
const DAYS = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5) + 1;
const fmtDay = s => parseYmd(s).toLocaleDateString("ms-MY", { day: "numeric", month: "short" });

if (!LIVE) { $("#banner").hidden = false; $("#bannerText").innerHTML = "<span><b>Mod demo.</b> Kata laluan: <b>1234</b>. Data diambil dari order dalam browser ini.</span>"; }

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2800); }
function closeModal() { $("#modal").innerHTML = ""; document.body.style.overflow = ""; }
function openModal(html, { wide = false } = {}) {
  $("#modal").innerHTML = `<div class="scrim" id="scrim"><div class="sheet ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.style.overflow = "hidden";
  $("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeModal(); });
  return $("#modal .sheet");
}
function csvDownload(name, rows) {
  const csv = rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- LOGIN ---------- */
let me = null, started = false;
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault(); $("#lErr").hidden = true; $("#lBtn").disabled = true;
  try { await staffLogin($("#lEmail").value.trim(), $("#lPw").value); if (!LIVE) location.reload(); }
  catch (err) { $("#lErr").textContent = err.message; $("#lErr").hidden = false; }
  $("#lBtn").disabled = false;
});

/* ---------- STATE ---------- */
let tab = (location.hash || "#laporan").slice(1);
let raw = null, menuSource = "config", costs = { products: {}, choices: {} };
const range = { key: "7d", from: addDays(today(), -6), to: today() };
let rep = null, loadingRep = false, charts = [], sortProd = "sales", orderFilter = { status: "all", source: "all", pay: "all", q: "" };

function setTab(t) {
  tab = ["laporan", "produk", "kategori", "shift", "order", "aktiviti"].includes(t) ? t : "laporan";
  try { history.replaceState(null, "", "#" + tab); } catch (e) {}
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab));
  render();
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => setTab(b.dataset.tab));

let curShift = null;
function start() {
  watchShift(s => curShift = s);
  watchMenu(m => { raw = m.raw; menuSource = m.source; if (!$("#modal").innerHTML && (tab === "produk" || tab === "kategori")) render(); });
  getCosts().then(c => { costs = c; if (tab !== "order") render(); }).catch(() => {});
  setTab(tab);
}

/* ================= RANGE ================= */
const RANGES = [["today", "Hari ini"], ["yday", "Semalam"], ["7d", "7 hari"], ["30d", "30 hari"], ["month", "Bulan ini"], ["lmonth", "Bulan lepas"], ["custom", "Pilih tarikh"]];
function applyRange(k) {
  const t = today(), d = parseYmd(t);
  range.key = k;
  if (k === "today") { range.from = range.to = t; }
  else if (k === "yday") { range.from = range.to = addDays(t, -1); }
  else if (k === "7d") { range.from = addDays(t, -6); range.to = t; }
  else if (k === "30d") { range.from = addDays(t, -29); range.to = t; }
  else if (k === "month") { range.from = ymd(new Date(d.getFullYear(), d.getMonth(), 1)); range.to = t; }
  else if (k === "lmonth") { range.from = ymd(new Date(d.getFullYear(), d.getMonth() - 1, 1)); range.to = ymd(new Date(d.getFullYear(), d.getMonth(), 0)); }
}
function rangeBar() {
  return `<div class="rangebar">
    <div class="chips">${RANGES.map(([k, l]) => `<button data-r="${k}" aria-pressed="${range.key === k}">${l}</button>`).join("")}</div>
    <div class="rb-dates"><label>Dari <input type="date" id="rFrom" value="${range.from}" max="${today()}"></label><label>Hingga <input type="date" id="rTo" value="${range.to}" max="${today()}"></label>
    <span class="muted">${fmtDay(range.from)}${range.from !== range.to ? " – " + fmtDay(range.to) : ""} · ${daysBetween(range.from, range.to)} hari</span></div>
  </div>`;
}
function bindRange(after) {
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { if (b.dataset.r !== "custom") applyRange(b.dataset.r); else range.key = "custom"; rep = null; after(); });
  const f = $("#rFrom"), t = $("#rTo");
  const ch = () => { if (f.value && t.value) { range.key = "custom"; range.from = f.value <= t.value ? f.value : t.value; range.to = f.value <= t.value ? t.value : f.value; rep = null; after(); } };
  if (f) f.onchange = ch; if (t) t.onchange = ch;
}

/* ================= KIRA LAPORAN ================= */
function itemCost(i) {
  const pid = i.pid || nameToPid(i.name);
  const base = costs.products?.[pid];
  if (base == null || base === "") return null;
  const extra = (i.opts || []).reduce((s, o) => s + (Number(costs.choices?.[o]) || 0), 0);
  return r2((Number(base) + extra) * i.qty);
}
let _n2p = null;
function nameToPid(name) {
  if (!_n2p || _n2p.raw !== raw) { _n2p = { raw, m: {} }; (raw?.products || []).forEach(p => _n2p.m[p.name] = p.id); }
  return _n2p.m[name];
}
function catName(i) {
  if (i.cat) return i.cat;
  const pid = i.pid || nameToPid(i.name); const p = raw?.products.find(x => x.id === pid);
  return p ? (raw.cats.find(c => c.id === p.cat)?.name || "Lain-lain") : "Lain-lain";
}
function compute(list, from, to) {
  const valid = list.filter(o => o.paid && !["cancel", "void"].includes(o.status));
  const cancelled = list.filter(o => o.status === "cancel");
  const voided = list.filter(o => o.status === "void");
  const noshow = list.filter(o => o.status === "noshow");
  const pending = list.filter(o => !o.paid && !["cancel", "void", "noshow"].includes(o.status));
  const R = { orders: valid.length, gross: 0, discount: 0, net: 0, items: 0, cost: 0, costKnownSales: 0, costMissing: new Set(),
    cancelled: cancelled.length, cancelledValue: r2(cancelled.reduce((s, o) => s + (o.total || 0), 0)), pending: pending.length,
    voided: voided.length, refundValue: r2(voided.reduce((s, o) => s + (o.refund?.amount || o.total || 0), 0)), noshow: noshow.length, noshowValue: r2(noshow.reduce((s, o) => s + (o.total || 0), 0)),
    priceFixed: valid.filter(o => o.priceFixed).length, cancelReasons: cancelled.reduce((m, o) => { const k = o.cancelReason || "Tiada alasan"; m[k] = (m[k] || 0) + 1; return m; }, {}),
    byDay: {}, byHour: Array(24).fill(0).map(() => ({ s: 0, n: 0 })), byDow: Array(7).fill(0).map(() => ({ s: 0, n: 0 })),
    prod: {}, cat: {}, pay: {}, voucher: {}, source: { app: { n: 0, s: 0 }, pos: { n: 0, s: 0 } }, member: { yes: { n: 0, s: 0 }, no: { n: 0, s: 0 } },
    opts: {}, gifts: 0, giftMsgs: {}, points: 0 };
  for (let d = from; d <= to; d = addDays(d, 1)) R.byDay[d] = { s: 0, n: 0 };
  valid.forEach(o => {
    const sub = o.subtotal ?? o.total, disc = o.discount || 0, net = o.total;
    R.gross += sub; R.discount += disc; R.net += net; R.points += o.points || 0;
    const t = new Date(o.paidAt || o.createdAt);
    if (R.byDay[o.day]) { R.byDay[o.day].s += net; R.byDay[o.day].n++; }
    R.byHour[t.getHours()].s += net; R.byHour[t.getHours()].n++;
    R.byDow[parseYmd(o.day).getDay()].s += net; R.byDow[parseYmd(o.day).getDay()].n++;
    const pm = o.payment?.method || "lain"; (R.pay[pm] ||= { n: 0, s: 0 }); R.pay[pm].n++; R.pay[pm].s += net;
    const src = o.source === "pos" ? "pos" : "app"; R.source[src].n++; R.source[src].s += net;
    const mb = o.member ? "yes" : "no"; R.member[mb].n++; R.member[mb].s += net;
    if (disc) { const k = o.voucherTitle || "Voucher"; (R.voucher[k] ||= { n: 0, d: 0, s: 0 }); R.voucher[k].n++; R.voucher[k].d += disc; R.voucher[k].s += net; }
    // agih diskaun ikut nilai item untuk untung produk
    const share = sub > 0 ? disc / sub : 0;
    (o.items || []).forEach(i => {
      const line = i.unit * i.qty, netLine = line * (1 - share);
      R.items += i.qty;
      const key = i.pid || nameToPid(i.name) || i.name;
      const p = (R.prod[key] ||= { name: i.name, cat: catName(i), qty: 0, s: 0, net: 0, cost: 0, costOk: true });
      p.qty += i.qty; p.s += line; p.net += netLine;
      const c = itemCost(i);
      if (c == null) { p.costOk = false; R.costMissing.add(i.name); } else { p.cost += c; R.cost += c; R.costKnownSales += netLine; }
      const cn = catName(i); const cc = (R.cat[cn] ||= { qty: 0, s: 0, net: 0, cost: 0 }); cc.qty += i.qty; cc.s += line; cc.net += netLine; if (c != null) cc.cost += c;
      (i.opts || []).forEach(op => { R.opts[op] = (R.opts[op] || 0) + i.qty; });
      if (i.gift?.msg) { R.gifts += i.qty; R.giftMsgs[i.gift.msg] = (R.giftMsgs[i.gift.msg] || 0) + i.qty; }
    });
  });
  R.profit = r2(R.costKnownSales - R.cost);
  R.margin = R.costKnownSales > 0 ? R.profit / R.costKnownSales * 100 : NaN;
  R.aov = R.orders ? R.net / R.orders : 0;
  return R;
}
async function loadReport() {
  if (loadingRep) return; loadingRep = true;
  try {
    const len = daysBetween(range.from, range.to);
    const pFrom = addDays(range.from, -len), pTo = addDays(range.from, -1);
    const [cur, prev] = await Promise.all([ordersInRange(range.from, range.to), ordersInRange(pFrom, pTo)]);
    rep = { list: cur, R: compute(cur, range.from, range.to), P: compute(prev, pFrom, pTo), from: range.from, to: range.to, pFrom, pTo };
  } catch (e) { console.error(e); rep = { error: true }; }
  loadingRep = false; render();
}

/* ================= RENDER ================= */
function render() {
  charts.forEach(c => c.destroy()); charts = [];
  const v = $("#view");
  if (tab === "laporan") return renderReport(v);
  if (tab === "produk") return renderProducts(v);
  if (tab === "kategori") return renderCats(v);
  if (tab === "shift") return renderShifts(v);
  if (tab === "order") return renderOrders(v);
  if (tab === "aktiviti") return renderAudit(v);
}

const delta = (a, b) => { if (!b) return a ? `<span class="dl up">baru</span>` : ""; const d = (a - b) / Math.abs(b) * 100; return `<span class="dl ${d >= 0 ? "up" : "down"}">${d >= 0 ? "▲" : "▼"} ${Math.abs(d).toFixed(0)}%</span>`; };
function kpi(label, val, sub = "", d = "") { return `<div class="kpi"><span>${label}</span><b class="num">${val}</b><small>${d} ${sub}</small></div>`; }
function table(head, rows, { cls = "" } = {}) {
  return `<div class="htable ${cls}"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.length ? rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${head.length}" class="muted">Tiada data untuk tempoh ini.</td></tr>`}</tbody></table></div>`;
}
const share = (a, t) => t ? `<span class="bar-in"><i style="width:${Math.max(2, a / t * 100)}%"></i></span><span class="num">${pct(a / t * 100)}</span>` : "—";

function renderReport(v) {
  if (!rep && !loadingRep) { v.innerHTML = rangeBar() + `<p class="muted pad">Mengira laporan…</p>`; bindRange(render); loadReport(); return; }
  if (loadingRep || !rep) { v.innerHTML = rangeBar() + `<p class="muted pad">Mengira laporan…</p>`; bindRange(render); return; }
  if (rep.error) { v.innerHTML = rangeBar() + `<div class="err pad">Tak dapat ambil data. Semak internet dan cuba lagi.</div>`; bindRange(render); return; }
  const { R, P } = rep;
  const prods = Object.values(R.prod).sort((a, b) => sortProd === "qty" ? b.qty - a.qty : sortProd === "profit" ? (b.net - b.cost) - (a.net - a.cost) : b.net - a.net);
  const cats = Object.entries(R.cat).sort((a, b) => b[1].net - a[1].net);
  const pays = Object.entries(R.pay).sort((a, b) => b[1].s - a[1].s);
  const vouchers = Object.entries(R.voucher).sort((a, b) => b[1].d - a[1].d);
  const opts = Object.entries(R.opts).sort((a, b) => b[1] - a[1]).slice(0, 12);
  const gifts = Object.entries(R.giftMsgs).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const days = Object.entries(R.byDay);
  const best = days.reduce((m, d) => d[1].s > (m?.[1].s ?? -1) ? d : m, null);
  const peak = R.byHour.reduce((m, h, i) => h.s > R.byHour[m].s ? i : m, 0);
  v.innerHTML = rangeBar() + `
    <section class="kpis">
      ${kpi("Jualan bersih", rm(R.net), "vs tempoh sebelum", delta(R.net, P.net))}
      ${kpi("Order dibayar", R.orders, "", delta(R.orders, P.orders))}
      ${kpi("Purata setiap order", rm(R.aov), "", delta(R.aov, P.aov))}
      ${kpi("Item terjual", R.items, "", delta(R.items, P.items))}
      ${kpi("Untung kasar", R.costKnownSales ? rm(R.profit) : "—", R.costMissing.size ? "sebahagian kos belum diisi" : "", R.costKnownSales ? delta(R.profit, P.profit) : "")}
      ${kpi("Margin kasar", pct(R.margin), "untung ÷ jualan bersih")}
      ${kpi("Diskaun / voucher", rm(R.discount), `${Object.values(R.voucher).reduce((s, x) => s + x.n, 0)} order guna voucher`)}
      ${kpi("Batal · tak ambil · refund", `${R.cancelled} · ${R.noshow} · ${R.voided}`, R.voided ? `Refund ${rm(R.refundValue)}` : R.cancelled ? rm(R.cancelledValue) + " nilai batal" : "")}
    </section>
    ${R.costMissing.size ? `<div class="warnbox">Kos belum diisi untuk: <b>${[...R.costMissing].slice(0, 6).map(esc).join(", ")}${R.costMissing.size > 6 ? "…" : ""}</b>. Untung dan margin hanya dikira untuk produk yang ada kos. Isi kos di tab <a href="#produk" data-go="produk">Produk</a>.</div>` : ""}
    ${R.pending ? `<p class="muted">${R.pending} order belum dibayar (masih dalam proses) tidak dikira.</p>` : ""}
    ${R.priceFixed ? `<div class="warnbox">⚠ ${R.priceFixed} order dihantar dengan harga yang tak sepadan dengan menu dan dibetulkan oleh staff semasa bayaran. Lihat tab <a href="#aktiviti" data-go="aktiviti">Aktiviti</a>.</div>` : ""}
    ${R.cancelled ? `<p class="muted">Alasan batal: ${Object.entries(R.cancelReasons).map(([k, n]) => `${esc(k)} (${n})`).join(" · ")}</p>` : ""}

    <section class="card">
      <div class="card-h"><h2>Jualan harian</h2><span class="muted">${best && best[1].s ? `Hari terbaik: <b>${fmtDay(best[0])}</b> (${rm(best[1].s)})` : ""}</span></div>
      <div class="chart-box"><canvas id="cDaily" aria-label="Jualan bersih setiap hari"></canvas></div>
      <details class="tv"><summary>Lihat jadual</summary>${table(["Tarikh", "Order", "Jualan bersih"], days.map(([d, x]) => [fmtDay(d) + " · " + DAYS[parseYmd(d).getDay()], `<span class="num">${x.n}</span>`, `<span class="num">${rm(x.s)}</span>`]))}</details>
    </section>

    <div class="grid2">
      <section class="card"><div class="card-h"><h2>Trend ikut jam</h2><span class="muted">${R.orders ? `Paling sibuk: <b>${String(peak).padStart(2, "0")}:00–${String(peak + 1).padStart(2, "0")}:00</b>` : ""}</span></div>
        <div class="chart-box sm"><canvas id="cHour" aria-label="Jualan ikut jam"></canvas></div></section>
      <section class="card"><div class="card-h"><h2>Trend ikut hari</h2></div>
        <div class="chart-box sm"><canvas id="cDow" aria-label="Jualan ikut hari dalam minggu"></canvas></div></section>
    </div>

    <section class="card">
      <div class="card-h"><h2>Jualan ikut produk</h2>
        <div class="seg mini">${[["sales", "Jualan"], ["qty", "Kuantiti"], ["profit", "Untung"]].map(([k, l]) => `<button data-sp="${k}" aria-pressed="${sortProd === k}">${l}</button>`).join("")}</div>
        <button class="btn ghost sm" id="csvProd">Muat turun CSV</button></div>
      ${table(["Produk", "Kategori", "Qty", "Jualan kasar", "Jualan bersih", "Kos", "Untung", "Margin", "Bahagian jualan"],
        prods.map(p => [esc(p.name), esc(p.cat), `<span class="num">${p.qty}</span>`, `<span class="num">${rm(p.s)}</span>`, `<span class="num">${rm(p.net)}</span>`,
          p.costOk ? `<span class="num">${rm(p.cost)}</span>` : `<span class="muted">belum isi</span>`, p.costOk ? `<span class="num">${rm(p.net - p.cost)}</span>` : "—",
          p.costOk && p.net ? `<span class="num">${pct((p.net - p.cost) / p.net * 100)}</span>` : "—", share(p.net, R.net)]))}
    </section>

    <div class="grid2">
      <section class="card"><div class="card-h"><h2>Jualan ikut kategori</h2></div>
        ${table(["Kategori", "Qty", "Jualan bersih", "Untung", "Bahagian"], cats.map(([n, c]) => [esc(n), `<span class="num">${c.qty}</span>`, `<span class="num">${rm(c.net)}</span>`, c.cost ? `<span class="num">${rm(c.net - c.cost)}</span>` : "—", share(c.net, R.net)]))}</section>
      <section class="card"><div class="card-h"><h2>Jualan ikut cara bayaran</h2></div>

function chartTheme() {
  const cs = getComputedStyle(document.body);
  return { ink: cs.getPropertyValue("--muted").trim() || "#6f6a5f", grid: cs.getPropertyValue("--line").trim() || "#e2d4bf", bar: cs.getPropertyValue("--accent").trim() || "#1F3D32", font: "Figtree, system-ui, sans-serif" };
}
function barChart(id, labels, data, extra, fmt = rm) {
  const el = document.getElementById(id); if (!el) return;
  if (!window.Chart) {   // sandaran jika library carta gagal dimuat
    const max = Math.max(...data, 0) || 1;
    el.parentElement.classList.add("fb");
    el.parentElement.innerHTML = `<div class="fbars">${labels.map((l, i) => `<div class="fb-c" title="${esc(l)}: ${fmt(data[i])}${extra ? " · " + esc(extra[i]) : ""}"><span class="fb-v num">${data[i] ? fmt(data[i]).replace("RM", "") : ""}</span><i style="height:${Math.max(data[i] ? 3 : 0, data[i] / max * 100)}%"></i><span class="fb-l">${esc(l)}</span></div>`).join("")}</div>`;
    return;
  }
  const t = chartTheme();
  charts.push(new Chart(el, {
    type: "bar",
    data: { labels, datasets: [{ data, backgroundColor: t.bar, hoverBackgroundColor: t.bar, borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: "bottom", maxBarThickness: 28, categoryPercentage: .8, barPercentage: .9 }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
      plugins: { legend: { display: false }, tooltip: { displayColors: false, callbacks: { label: c => fmt(c.parsed.y) + (extra ? " · " + extra[c.dataIndex] : "") } } },
      scales: {
        x: { grid: { display: false }, ticks: { color: t.ink, font: { family: t.font, size: 11 }, maxRotation: 0, autoSkipPadding: 8 }, border: { color: t.grid } },
        y: { beginAtZero: true, grid: { color: t.grid }, border: { display: false }, ticks: { color: t.ink, font: { family: t.font, size: 11 }, maxTicksLimit: 5, callback: v => "RM" + v } },
      },
    },
  }));
}
function drawCharts(R, days) {
  barChart("cDaily", days.map(([d]) => fmtDay(d)), days.map(([, x]) => r2(x.s)), days.map(([, x]) => x.n + " order"));
  const hrs = R.byHour.map((h, i) => [i, h]).filter(([i, h]) => h.n || (i >= 8 && i <= 22));
  barChart("cHour", hrs.map(([i]) => String(i).padStart(2, "0")), hrs.map(([, h]) => r2(h.s)), hrs.map(([, h]) => h.n + " order"));
  const order = [1, 2, 3, 4, 5, 6, 0];
  barChart("cDow", order.map(i => DAYS[i].slice(0, 3)), order.map(i => r2(R.byDow[i].s)), order.map(i => R.byDow[i].n + " order"));
}

async function compressImage(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const S = 480, s = Math.min(1, S / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  let q = .8, url = c.toDataURL("image/webp", q);
  if (!url.startsWith("data:image/webp")) url = c.toDataURL("image/jpeg", q);
  while (url.length > 180000 && q > .4) { q -= .1; url = c.toDataURL(url.startsWith("data:image/webp") ? "image/webp" : "image/jpeg", q); }
  return url;
}

      <div class="opt"><label class="t">Pilihan</label>
        <div class="ch-rows"><div class="ch-h"><span>Nama pilihan</span><span>Harga tambahan (RM)</span><span>Kos tambahan (RM)</span><span>Asal</span><span></span></div>
        ${g.choices.map((x, i) => `<div class="ch-r"><input type="text" data-cn="${i}" value="${esc(x.n)}" placeholder="Cth: Large"><input type="text" inputmode="decimal" data-cp="${i}" value="${esc(x.p || "")}" placeholder="0"><input type="text" inputmode="decimal" data-cc="${i}" value="${esc(x.c)}" placeholder="0"><input type="radio" name="gdef" data-cd="${i}" ${g.def === i ? "checked" : ""} aria-label="Pilihan asal"><button class="btn ghost sm" data-cx="${i}" ${g.choices.length < 2 ? "disabled" : ""}>×</button></div>`).join("")}
        </div><button class="linkish" id="gAdd">＋ Tambah pilihan</button></div>
      ${used ? `<p class="muted">Digunakan oleh ${used} produk.</p>` : ""}
      ${err ? `<div class="err">${esc(err)}</div>` : ""}
      <div class="sheet-foot">${id ? `<button class="btn ghost" id="gDel" style="color:var(--new)">Padam</button>` : ""}<button class="btn ghost" id="gX" style="margin-left:auto">Batal</button><button class="btn" id="gSave">Simpan</button></div>`, { wide: true });
    const keep = () => {
      g.name = $("#gName").value.trim(); g.sort = Number($("#gSort").value) || 0;
      g.choices.forEach((x, i) => { x.n = sh.querySelector(`[data-cn="${i}"]`).value.trim(); x.p = num(sh.querySelector(`[data-cp="${i}"]`).value) || 0; x.c = sh.querySelector(`[data-cc="${i}"]`).value.trim(); if (sh.querySelector(`[data-cd="${i}"]`).checked) g.def = i; });
    };
    $("#gAdd").onclick = () => { keep(); g.choices.push({ n: "", p: 0, c: "" }); draw(); };
    sh.querySelectorAll("[data-cx]").forEach(b => b.onclick = () => { keep(); g.choices.splice(+b.dataset.cx, 1); if (g.def >= g.choices.length) g.def = 0; draw(); });
    $("#gX").onclick = closeModal;
    const d = $("#gDel"); if (d) d.onclick = async () => { await deleteMenuItem("groups", id).catch(() => {}); closeModal(); toast("Kumpulan pilihan dipadam."); };
    $("#gSave").onclick = async () => {
      keep();
      const ch = g.choices.filter(x => x.n);
      if (!g.name || !ch.length) { err = "Isi nama kumpulan dan sekurang-kurangnya satu pilihan."; draw(); return; }
      try {
        await saveMenuItem("groups", { ...(id ? { id } : {}), name: g.name, sort: g.sort, def: Math.min(g.def, ch.length - 1), choices: ch.map(x => ({ n: x.n, p: x.p || 0 })) });
        const cc = { ...costs, choices: { ...costs.choices } };
        ch.forEach(x => { const v = num(x.c); if (x.c === "" || isNaN(v)) delete cc.choices[x.n]; else cc.choices[x.n] = v; });
        await saveCosts(cc); costs = cc;
        closeModal(); toast("Kumpulan pilihan disimpan.");
      } catch (e) { console.error(e); err = "Tak berjaya simpan."; draw(); }
    };
  };
  draw();
}

/* ================= SHIFT ================= */
let shiftData = null;
async function renderShifts(v) {
  v.innerHTML = rangeBar() + `<p class="muted pad">Memuatkan shift…</p>`;
  bindRange(() => { shiftData = null; render(); });
  const fromTs = parseYmd(range.from).getTime(), toTs = parseYmd(range.to).getTime() + 864e5 - 1;
  try { shiftData = await shiftsInRange(fromTs, toTs); } catch (e) { v.innerHTML = rangeBar() + `<div class="err pad">Tak dapat ambil data shift.</div>`; bindRange(render); return; }
  if (tab !== "shift") return;
  const L = shiftData, closed = L.filter(s => s.status === "closed");
  const tot = k => r2(closed.reduce((s, x) => s + (x.totals?.[k] || 0), 0));
  const varSum = r2(closed.reduce((s, x) => s + (x.variance || 0), 0));
  v.innerHTML = rangeBar() + `
    <section class="kpis">
      ${kpi("Shift", L.length, L.length - closed.length ? `${L.length - closed.length} masih dibuka` : "")}
      ${kpi("Jualan shift", rm(closed.reduce((s, x) => s + (x.sales || 0), 0)))}
      ${kpi("CASH", rm(tot("cash")))}${kpi("QRPay", rm(tot("qr")))}${kpi("Kad", rm(tot("card")))}
      ${kpi("Jumlah beza tunai", (varSum > 0 ? "+" : varSum < 0 ? "−" : "") + rm(Math.abs(varSum)), closed.filter(x => x.variance).length + " shift ada beza")}
    </section>
    <section class="card"><div class="card-h"><h2>Senarai shift</h2></div>
    ${table(["Dibuka", "Ditutup", "Staff", "Duit awal", "Order", "CASH", "QR", "Kad", "Jualan", "Refund tunai", "Tunai dijangka", "Dikira", "Beza", "Pengecualian", "Catatan"],
      L.map(s => [dtm(s.openedAt), s.status === "closed" ? dtm(s.closedAt) : "<b>Masih dibuka</b>", esc(s.staffName || ""), rm(s.openingCash || 0), s.orderCount ?? "—",
        s.totals ? rm(s.totals.cash) : "—", s.totals ? rm(s.totals.qr) : "—", s.totals ? rm(s.totals.card) : "—", s.sales != null ? rm(s.sales) : "—", s.refundCash ? rm(s.refundCash) : "—",
        s.expectedCash != null ? rm(s.expectedCash) : "—", s.countedCash != null ? rm(s.countedCash) : "—",
        s.variance != null ? `<span class="${s.variance < 0 ? "neg" : s.variance > 0 ? "pos" : ""}">${s.variance > 0 ? "+" : s.variance < 0 ? "−" : ""}${rm(Math.abs(s.variance))}</span>` : "—",
        s.exceptions ? [s.exceptions.pending?.length ? `${s.exceptions.pending.length} tergantung` : "", s.exceptions.cancelled?.length ? `${s.exceptions.cancelled.length} batal` : "", s.exceptions.noshow?.length ? `${s.exceptions.noshow.length} tak ambil` : "", s.exceptions.priceFixed?.length ? `${s.exceptions.priceFixed.length} harga` : "", s.exceptions.refunds?.length ? `${s.exceptions.refunds.length} refund` : "", s.exceptions.reprints?.length ? `${s.exceptions.reprints.length} cetak semula` : ""].filter(Boolean).join(", ") || "Tiada" : "—",
        esc(s.note || "")]))}
    </section>`;
  bindRange(() => { shiftData = null; render(); });
}

/* ================= ORDER ================= */
let orderData = null, orderKey = "";
async function renderOrders(v) {
  const key = range.from + range.to;
  if (!orderData || orderKey !== key) {
    v.innerHTML = rangeBar() + `<p class="muted pad">Memuatkan order…</p>`; bindRange(render);
    try { orderData = await ordersInRange(range.from, range.to); orderKey = key; } catch (e) { v.innerHTML = rangeBar() + `<div class="err pad">Tak dapat ambil order.</div>`; bindRange(render); return; }
    if (tab !== "order") return;
  }
  const f = orderFilter, q = f.q.toLowerCase();
  const stLabel = o => ({ cancel: "Batal", void: "Refund", noshow: "Tak datang ambil", done: "Selesai", collected: "Diambil" }[o.status] || (o.paid ? "Dibayar" : "Dalam proses"));
  const L = orderData.filter(o => (f.status === "all" || (f.status === "done" ? ["done", "collected"].includes(o.status) : f.status === "cancel" ? ["cancel", "void", "noshow"].includes(o.status) : !["done", "collected", "cancel", "void", "noshow"].includes(o.status)))
    && (f.source === "all" || (f.source === "pos" ? o.source === "pos" : o.source !== "pos"))
    && (f.pay === "all" || o.payment?.method === f.pay)
    && (!q || (o.name || "").toLowerCase().includes(q) || pad3(o.no).includes(q) || (o.items || []).some(i => i.name.toLowerCase().includes(q))))
    .sort((a, b) => b.createdAt - a.createdAt);
  v.innerHTML = rangeBar() + `
    <div class="filters">
      <label>Status <select id="fSt"><option value="all">Semua</option><option value="done">Selesai</option><option value="open">Dalam proses</option><option value="cancel">Batal / refund / tak ambil</option></select></label>
      <label>Sumber <select id="fSrc"><option value="all">Semua</option><option value="app">App</option><option value="pos">Kaunter</option></select></label>
      <label>Bayaran <select id="fPay"><option value="all">Semua</option>${PAYMENTS.map(p => `<option value="${p.id}">${esc(p.label)}</option>`).join("")}</select></label>
      <label class="grow">Cari <input type="search" id="fQ" value="${esc(f.q)}" placeholder="Nama, no. order atau produk"></label>
      <button class="btn ghost sm" id="csvO">Muat turun CSV</button>
    </div>
    <p class="muted">${L.length} order · ${rm(L.filter(o => o.paid && o.status !== "cancel").reduce((s, o) => s + o.total, 0))} dibayar</p>
    ${table(["Tarikh", "No", "Nama", "Sumber", "Item", "Diskaun", "Jumlah", "Bayaran", "Status", ""],
      L.slice(0, 300).map(o => [dtm(o.createdAt), `<b class="num">#${pad3(o.no)}</b>`, esc(o.name || "—"), o.source === "pos" ? "Kaunter" : "App", (o.items || []).reduce((s, i) => s + i.qty, 0),
        o.discount ? `<span class="num">-${rm(o.discount)}</span>` : "", `<span class="num">${rm(o.total)}</span>`, o.paid ? esc(PAY[o.payment?.method]?.short || "-") : "—", stLabel(o), `<button class="btn ghost sm" data-ov="${o.id}">Lihat</button>`]))}
    ${L.length > 300 ? `<p class="muted">Menunjukkan 300 order terkini. Muat turun CSV untuk senarai penuh.</p>` : ""}`;
  bindRange(render);
  $("#fSt").value = f.status; $("#fSrc").value = f.source; $("#fPay").value = f.pay;
  $("#fSt").onchange = e => { f.status = e.target.value; render(); };
  $("#fSrc").onchange = e => { f.source = e.target.value; render(); };
  $("#fPay").onchange = e => { f.pay = e.target.value; render(); };
  let t; $("#fQ").oninput = e => { clearTimeout(t); t = setTimeout(() => { f.q = e.target.value; render(); setTimeout(() => { const i = $("#fQ"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 0); }, 300); };
  $("#csvO").onclick = () => csvDownload(`sips-order-${range.from}_${range.to}.csv`, [["Tarikh", "Masa", "No", "Nama", "Telefon", "Sumber", "Ahli", "Item", "Subtotal", "Diskaun", "Voucher", "Jumlah", "Bayaran", "Tunai diterima", "Baki", "Status"],
    ...L.map(o => [o.day, tm(o.createdAt), o.no, o.name || "", o.phone || "", o.source === "pos" ? "Kaunter" : "App", o.member ? "Ya" : "Tidak",
      (o.items || []).map(i => `${i.qty}x ${i.name}${i.opts?.length ? " (" + i.opts.join("/") + ")" : ""}`).join("; "), o.subtotal ?? o.total, o.discount || 0, o.voucherTitle || "", o.total,
      o.paid ? (PAY[o.payment?.method]?.label || "") : "", o.payment?.tendered ?? "", o.payment?.change ?? "", stLabel(o)])]);
  document.querySelectorAll("[data-ov]").forEach(b => b.onclick = () => viewOrder(orderData.find(o => o.id === b.dataset.ov)));
}
function viewOrder(o) {
  openModal(`<h2>Order #${pad3(o.no)}</h2><div class="sub">${dtm(o.createdAt)} · ${o.source === "pos" ? "Kaunter" : "App"}${o.member ? " · Ahli" : ""}</div>
    <p><b>${esc(o.name || "—")}</b>${o.phone ? " · " + esc(o.phone) : ""}</p>
    ${table(["Item", "Qty", "Harga", "Jumlah"], (o.items || []).map(i => [`${esc(i.name)}${i.opts?.length ? `<br><small class="muted">${esc(i.opts.join(" · "))}</small>` : ""}${i.note ? `<br><small>Nota: ${esc(i.note)}</small>` : ""}${i.gift?.msg ? `<br><small class="giftline">♥ ${i.gift.to ? "Untuk " + esc(i.gift.to) + ": " : ""}“${esc(i.gift.msg)}”${i.gift.from ? " — " + esc(i.gift.from) : ""}</small>` : ""}`, i.qty, rm(i.unit), rm(i.unit * i.qty)]))}
    <div class="sumgrid">
      <div><span>Subtotal</span><b class="num">${rm(o.subtotal ?? o.total)}</b></div>
      <div><span>Diskaun${o.voucherTitle ? " · " + esc(o.voucherTitle) : ""}</span><b class="num">${o.discount ? "-" + rm(o.discount) : "—"}</b></div>
      <div class="hl"><span>Jumlah</span><b class="num">${rm(o.total)}</b></div>
      <div><span>Bayaran</span><b>${o.paid ? esc(PAY[o.payment?.method]?.label || "-") : "Belum bayar"}</b></div>
      <div><span>Status</span><b>${({ cancel: "Batal", void: "Refund", noshow: "Tak datang ambil", done: "Selesai", collected: "Diambil" })[o.status] || "Dalam proses"}</b></div>
      ${o.payment?.ref ? `<div><span>Rujukan bayaran</span><b>${esc(o.payment.ref)}</b></div>` : ""}
      ${o.payment?.verifiedBy ? `<div><span>Disahkan oleh</span><b>${esc(o.payment.verifiedBy)}</b></div>` : ""}
      ${o.cancelReason ? `<div class="hl red"><span>Dibatalkan oleh ${esc(o.cancelledBy || "")}</span><b>${esc(o.cancelReason)}</b></div>` : ""}
      ${o.voidReason ? `<div class="hl red"><span>Refund oleh ${esc(o.voidedBy || "")} · ${esc(PAY[o.refund?.method]?.label || "")}</span><b>${esc(o.voidReason)} · ${rm(o.refund?.amount || 0)}</b></div>` : ""}
      ${o.priceFixed ? `<div><span>Harga dibetulkan</span><b class="num">${rm(o.totalOriginal)} → ${rm(o.total)}</b></div>` : ""}
      ${o.payment?.method === "cash" ? `<div><span>Tunai / baki</span><b class="num">${rm(o.payment.tendered)} / ${rm(o.payment.change)}</b></div>` : ""}
      ${o.pointsAwarded ? `<div><span>Point diberi</span><b class="num">+${o.points}</b></div>` : ""}
    </div>
    <div class="sheet-foot">${o.paid && !["void", "cancel"].includes(o.status) ? `<button class="btn ghost" id="ovVoid" style="color:var(--new)">Refund / void</button>` : ""}<button class="btn wide" id="ovX"><span>Tutup</span><span>✓</span></button></div>`, { wide: true });
  $("#ovX").onclick = closeModal;
  const vb = $("#ovVoid"); if (vb) vb.onclick = () => openVoid(o);
}

function openVoid(o) {
  let reason = "", method = o.payment?.method || "cash", err = "", busy = false;
  const draw = () => {
    const sh = openModal(`<h2>Refund / void order #${pad3(o.no)}</h2>
      <div class="sub">${esc(o.name || "—")} · dibayar ${rm(o.total)} (${esc(PAY[o.payment?.method]?.label || "")})</div>
      <div class="warnbox">Order <b>tidak dipadam</b>. Ia ditanda "Refund" dan direkod dalam Aktiviti bersama nama admin, alasan dan masa. ${o.pointsAwarded ? `Point ahli (${o.points}) akan ditolak semula. ` : ""}${o.voucherId ? "Voucher dipulangkan kepada ahli." : ""}</div>
      <div class="opt"><label class="t">Cara refund</label><div class="seg">${PAYMENTS.map(p => `<button data-m="${p.id}" aria-pressed="${method === p.id}">${esc(p.label)}</button>`).join("")}</div></div>
      <label class="field"><span>Alasan (wajib)</span><input type="text" id="vR" maxlength="120" value="${esc(reason)}" placeholder="Cth: minuman tumpah, pelanggan tak puas hati"></label>
      ${method === "cash" ? `<p class="muted">Refund tunai ${curShift?.open ? "akan ditolak daripada tunai dijangka shift semasa." : "direkod tanpa shift (tiada shift dibuka)."}</p>` : ""}
      ${err ? `<div class="err">${esc(err)}</div>` : ""}
      <div class="sheet-foot"><button class="btn ghost" id="vX">Batal</button><button class="btn" style="background:var(--new);color:#fff" id="vOk" ${busy ? "disabled" : ""}>${busy ? "Memproses…" : `Sahkan refund ${rm(o.total)}`}</button></div>`);
    sh.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { reason = $("#vR").value; method = b.dataset.m; draw(); });
    $("#vX").onclick = () => viewOrder(o);
    $("#vOk").onclick = async () => {
      reason = $("#vR").value.trim();
      if (reason.length < 3) { err = "Sila tulis alasan refund."; draw(); return; }
      busy = true; draw();
      try { await voidOrder(o, { reason, method, by: me.email, shiftId: curShift?.open && method === "cash" ? curShift.shiftId : (curShift?.open ? curShift.shiftId : "") }); orderData = null; rep = null; closeModal(); toast(`Order #${pad3(o.no)} di-refund.`); render(); }
      catch (e) { console.error(e); busy = false; err = "Tak berjaya refund. Pastikan akaun admin dan rules terkini."; draw(); }
    };
  };
  draw();
}

/* ================= AKTIVITI (AUDIT LOG) ================= */
const ACT = { cancel: "Batal order", void_refund: "Refund / void", noshow: "Tak datang ambil", price_fix: "Harga dibetulkan", reprint: "Cetak sticker semula",
  shift_open: "Buka shift", shift_close: "Tutup shift", stock_out: "Tanda stok habis", stock_in: "Stok ada semula", pause_orders: "Jeda order app", resume_orders: "Buka order app",
  price_change: "Tukar harga produk", product_delete: "Padam produk", product_add: "Tambah produk" };
let auditData = null, auditKey = "", auditFilter = "all";
async function renderAudit(v) {
  const fromTs = parseYmd(range.from).getTime(), toTs = parseYmd(range.to).getTime() + 864e5 - 1, key = fromTs + "-" + toTs;
  if (!auditData || auditKey !== key) {
    v.innerHTML = rangeBar() + `<p class="muted pad">Memuatkan aktiviti…</p>`; bindRange(render);
    try { auditData = await auditInRange(fromTs, toTs); auditKey = key; } catch (e) { v.innerHTML = rangeBar() + `<div class="err pad">Tak dapat ambil aktiviti. Pastikan rules terkini dah Publish.</div>`; bindRange(render); return; }
    if (tab !== "aktiviti") return;
  }
  const counts = auditData.reduce((m, a) => (m[a.action] = (m[a.action] || 0) + 1, m), {});
  const L = auditData.filter(a => auditFilter === "all" || a.action === auditFilter);
  v.innerHTML = rangeBar() + `
    <p class="muted">Semua tindakan sensitif direkod secara automatik dan <b>tidak boleh diubah atau dipadam</b>, termasuk oleh admin.</p>
    <div class="chips wrapchips"><button data-af="all" aria-pressed="${auditFilter === "all"}">Semua (${auditData.length})</button>${Object.entries(counts).map(([k, n]) => `<button data-af="${k}" aria-pressed="${auditFilter === k}">${esc(ACT[k] || k)} (${n})</button>`).join("")}</div>
    ${table(["Masa", "Tindakan", "Order", "Jumlah", "Butiran", "Oleh"], L.slice(0, 500).map(a => [dtm(a.at), `<b>${esc(ACT[a.action] || a.action)}</b>`, a.no ? `#${pad3(a.no)}` : "", a.amount != null ? rm(a.amount) : a.from != null ? `${rm(a.from)} → ${rm(a.to)}` : "", esc(a.detail || ""), esc(a.by || "")]))}`;
  bindRange(render);
  document.querySelectorAll("[data-af]").forEach(b => b.onclick = () => { auditFilter = b.dataset.af; render(); });
}

staffWatch((staff, reason) => {
  if (!staff || staff.role !== "admin") {
    $("#login").hidden = false; $("#app").hidden = true; $("#who").hidden = true;
    if (staff && staff.role !== "admin") { $("#lErr").innerHTML = `Akaun <b>${esc(staff.email)}</b> ialah staff biasa, bukan admin. Untuk jadikan admin: Firebase → Firestore → koleksi <b>staff</b> → dokumen emel ini → tukar field <b>role</b> kepada <b>admin</b>. <button class="btn ghost sm" id="lo2" type="button">Log keluar</button>`; $("#lErr").hidden = false; $("#lo2").onclick = () => staffLogout(); }
    else if (reason) { $("#lErr").textContent = reason; $("#lErr").hidden = false; }
    return;
  }
  me = staff;
  $("#login").hidden = true; $("#app").hidden = false;
  $("#who").hidden = false; $("#who").innerHTML = `${esc(staff.email)} <a class="who-link" href="outlet.html">Dashboard outlet</a> <button id="logout">Log keluar</button>`;
  $("#logout").onclick = () => staffLogout();
  if (!started) { started = true; start(); }
});
</script>
</body>
</html>

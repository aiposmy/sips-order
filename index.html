<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIPS Order</title>
<meta name="theme-color" content="#1F3D32">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Figtree:wght@400;500;600;700&family=Dancing+Script:wght@600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="band">
  <div class="wrap">
    <img class="logo" src="logo.png" alt="SIPS Barley &amp; Comfort">
    <span class="tag">Goodness in Every Sip.</span>
  </div>
</header>
<div class="banner" id="banner" hidden><div class="wrap" id="bannerText"></div></div>

<main id="view-menu" class="wrap"></main>
<div class="cartbar" id="cartbar" hidden><button id="openCart"><span class="count num" id="cartCount">0</span> Lihat troli <span class="tot num" id="cartTot">RM0.00</span></button></div>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { MENU } from "./config.js";
import { LIVE, customerInit, createOrder, watchMyOrder } from "./data.js";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rm = n => "RM" + (Math.round(n * 100) / 100).toFixed(2);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

if (!LIVE) { $("#banner").hidden = false; $("#bannerText").innerHTML = "<span><b>Mod demo.</b> Order disimpan dalam browser ini sahaja. Buka <b>outlet.html</b> dalam tab lain untuk lihat order masuk.</span>"; }
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

const ITEM = {}; MENU.forEach(c => c.items.forEach(i => ITEM[i.id] = i));
function art(it) {
  if (it.food) return `<svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><ellipse cx="27" cy="38" rx="22" ry="7" fill="var(--line)"/><rect x="10" y="18" width="34" height="18" rx="7" fill="${it.color}"/><rect x="10" y="18" width="34" height="6" rx="3" fill="#fff" opacity=".35"/></svg>`;
  return `<svg width="54" height="62" viewBox="0 0 54 62" aria-hidden="true"><rect x="25" y="1" width="3" height="16" rx="1.5" fill="var(--green)" transform="rotate(12 26 9)"/><path d="M9 14h36l-4 44a3 3 0 0 1-3 3H16a3 3 0 0 1-3-3z" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><path d="M12 24h30l-3.2 33a2 2 0 0 1-2 2H17.2a2 2 0 0 1-2-2z" fill="${it.color}"/><rect x="7" y="11" width="40" height="5" rx="2.5" fill="var(--green)"/><path d="M27 40c-3-4-1-8 3-9-1 4 0 6-3 9z" fill="var(--green)" opacity=".7"/></svg>`;
}

/* ---------- state ---------- */
let cat = "all", cart = ls.get("sips.cart", []), myOrder = ls.get("sips.myorder", null), myOrderData = null, unwatch = null;
const orderType = "take"; let custName = ls.get("sips.name", ""), custPhone = "";
const saveCart = () => ls.set("sips.cart", cart);
const cartTotal = () => cart.reduce((s, l) => s + l.unit * l.qty, 0);
const cartQty = () => cart.reduce((s, l) => s + l.qty, 0);

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
function closeModal() { $("#modal").innerHTML = ""; document.body.style.overflow = ""; }
function openModal(draw) {
  $("#modal").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"></div></div>`;
  document.body.style.overflow = "hidden";
  $("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeModal(); });
  draw($("#modal .sheet"));
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ---------- menu ---------- */
function render() {
  if (myOrder) return renderMyOrder();
  const counts = {}; cart.forEach(l => counts[l.itemId] = (counts[l.itemId] || 0) + l.qty);
  $("#view-menu").innerHTML = `
    <section class="hero">
      <div><h1>Pesan barli kegemaran,<br>siap untuk diambil.</h1>
      <p>Order dari telefon, kami terus sediakan. Datang ambil bila status bertukar "Siap", tak perlu beratur.</p></div>
      <div class="where"><strong>Takeaway</strong> · ambil di kaunter</div>
    </section>
    <div class="chips" role="toolbar" aria-label="Kategori">
      <button data-cat="all" aria-pressed="${cat === "all"}">Semua</button>
      ${MENU.map(c => `<button data-cat="${esc(c.cat)}" aria-pressed="${cat === c.cat}">${esc(c.cat)}</button>`).join("")}
    </div>
    ${MENU.filter(c => cat === "all" || c.cat === cat).map(c => `
      <h2 class="cat-title">${esc(c.cat)}</h2>
      <div class="grid">${c.items.map(it => `
        <button class="item" data-item="${it.id}">
          <span class="art">${art(it)}</span>
          <span><h3>${esc(it.name)}</h3><p>${esc(it.desc)}</p>
          <span class="row"><span class="price num">${rm(it.price)}</span>${counts[it.id] ? `<span class="incart">${counts[it.id]} dalam troli</span>` : ""}<span class="add" aria-hidden="true">+</span></span></span>
        </button>`).join("")}</div>`).join("")}
    <div class="spacer"></div>`;
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { cat = b.dataset.cat; render(); });
  document.querySelectorAll("[data-item]").forEach(b => b.onclick = () => openItem(b.dataset.item));
  updateCartBar();
}
function updateCartBar() {
  $("#cartCount").textContent = cartQty(); $("#cartTot").textContent = rm(cartTotal());
  $("#cartbar").hidden = !cart.length || !!myOrder;
}
function openItem(id) {
  const it = ITEM[id]; const sel = {}; it.opts.forEach(o => sel[o.key] = o.def || 0); let qty = 1, note = "";
  const unit = () => it.price + it.opts.reduce((s, o) => s + o.choices[sel[o.key]].p, 0);
  openModal(function draw(sh) {
    sh.innerHTML = `
      <div style="display:flex;gap:14px;align-items:center"><span class="art" style="width:64px;height:64px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none">${art(it)}</span>
      <div><h2>${esc(it.name)}</h2><div class="sub">${esc(it.desc)}</div></div></div>
      ${it.opts.map(o => `<div class="opt"><label class="t">${o.label}</label><div class="seg">${o.choices.map((c, i) => `<button data-k="${o.key}" data-i="${i}" aria-pressed="${sel[o.key] === i}">${c.n}${c.p ? ` <small>+${rm(c.p)}</small>` : ""}</button>`).join("")}</div></div>`).join("")}
      <label class="field"><span>Nota untuk dapur</span><input type="text" id="itemNote" maxlength="80" placeholder="Cth: ais sikit, tanpa straw" value="${esc(note)}"></label>
      <div class="sheet-foot"><div class="qty"><button id="qm" aria-label="Kurang">−</button><span class="num">${qty}</span><button id="qp" aria-label="Tambah">+</button></div>
      <button class="btn wide" id="addBtn"><span>Masuk troli</span><span class="num">${rm(unit() * qty)}</span></button></div>`;
    const keep = () => note = $("#itemNote").value;
    sh.querySelectorAll(".seg button").forEach(b => b.onclick = () => { keep(); sel[b.dataset.k] = +b.dataset.i; draw(sh); });
    $("#qm").onclick = () => { keep(); qty = Math.max(1, qty - 1); draw(sh); };
    $("#qp").onclick = () => { keep(); qty = Math.min(20, qty + 1); draw(sh); };
    $("#addBtn").onclick = () => {
      note = $("#itemNote").value.trim();
      const opts = it.opts.map(o => o.choices[sel[o.key]].n);
      const key = id + "|" + opts.join("|") + "|" + note;
      const ex = cart.find(l => l.key === key);
      if (ex) ex.qty += qty; else cart.push({ key, itemId: id, name: it.name, opts, note, unit: unit(), qty, food: !!it.food });
      saveCart(); closeModal(); render(); toast(`${qty}× ${it.name} masuk troli`);
    };
  });
}

/* ---------- checkout ---------- */
$("#openCart").onclick = () => {
  let err = "";
  openModal(function draw(sh) {
    if (!cart.length) { closeModal(); render(); return; }
    sh.innerHTML = `
      <h2>Troli anda</h2><div class="sub">${cartQty()} item</div>
      ${cart.map((l, i) => `<div class="line"><span class="nm">${esc(l.name)}</span>
        <span class="op">${esc([...l.opts, l.note && ("Nota: " + l.note)].filter(Boolean).join(" · ")) || "&nbsp;"}</span>
        <span class="ctl"><span class="num" style="font-weight:700">${rm(l.unit * l.qty)}</span>
        <span class="qty"><button data-m="${i}" aria-label="Kurang">−</button><span class="num">${l.qty}</span><button data-p="${i}" aria-label="Tambah">+</button></span></span></div>`).join("")}
      <div class="sum"><span>Jumlah</span><span class="num">${rm(cartTotal())}</span></div>
      <div class="hint" style="margin-top:12px"><b>Takeaway</b> · ambil di kaunter bila order siap.</div>
      <label class="field"><span>Nama</span><input type="text" id="fName" maxlength="30" placeholder="Nama untuk panggilan" value="${esc(custName)}"></label>
      <label class="field"><span>No. telefon (pilihan)</span><input type="tel" id="fPhone" maxlength="15" placeholder="01x-xxxxxxx" value="${esc(custPhone)}"></label>
      <div class="hint" style="margin-top:12px">Bayaran di kaunter semasa ambil. Maklumat anda hanya digunakan untuk urusan order ini.</div>
      ${err ? `<div class="err">${esc(err)}</div>` : ""}
      <div class="sheet-foot"><button class="btn ghost" id="cClose">Tambah lagi</button><button class="btn wide" id="cSend"><span>Hantar order</span><span class="num">${rm(cartTotal())}</span></button></div>`;
    const keep = () => { const n = $("#fName"), p = $("#fPhone"); if (n) custName = n.value.trim(); if (p) custPhone = p.value.trim(); };
    sh.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { keep(); const l = cart[+b.dataset.m]; l.qty--; if (l.qty < 1) cart.splice(+b.dataset.m, 1); saveCart(); updateCartBar(); draw(sh); });
    sh.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { keep(); cart[+b.dataset.p].qty++; saveCart(); updateCartBar(); draw(sh); });
    $("#cClose").onclick = () => { keep(); closeModal(); render(); };
    $("#cSend").onclick = async () => {
      keep();
      if (!custName) { err = "Sila isi nama supaya staff boleh panggil bila order siap."; draw(sh); return; }
      const btn = $("#cSend"); btn.disabled = true; btn.firstElementChild.textContent = "Menghantar…";
      try {
        await customerInit();
        const r = await createOrder({
          type: "take", table: "", name: custName, phone: custPhone,
          items: cart.map(l => ({ name: l.name, opts: l.opts, note: l.note, qty: l.qty, unit: l.unit, food: l.food })),
          total: Math.round(cartTotal() * 100) / 100
        });
        ls.set("sips.name", custName);
        myOrder = r; ls.set("sips.myorder", r); cart = []; saveCart();
        closeModal(); startWatch(); render();
      } catch (e) { console.error(e); err = "Order tak berjaya dihantar. Semak internet dan cuba lagi."; draw(sh); }
    };
  });
};

/* ---------- status order sendiri ---------- */
const STEPS = [["new", "Diterima"], ["prep", "Disediakan"], ["ready", "Siap"]];
async function startWatch() {
  if (!myOrder) return;
  try { await customerInit(); unwatch && unwatch(); unwatch = await watchMyOrder(myOrder.id, o => { myOrderData = o; render(); }); } catch (e) { console.error(e); }
}
function renderMyOrder() {
  const o = myOrderData, st = o?.status || "new";
  const idx = st === "done" ? 2 : STEPS.findIndex(s => s[0] === st);
  const msg = { new: "Order anda dah sampai ke kaunter. Staff akan sahkan sekejap lagi.", prep: "Barista sedang sediakan order anda.", ready: "Order anda dah siap! Sila ambil di kaunter.", done: "Terima kasih! Jumpa lagi di SIPS.", cancel: "Order ini dibatalkan oleh outlet. Sila hubungi kaunter." }[st];
  $("#view-menu").innerHTML = `<div class="done">
    <div style="font-weight:700;color:var(--muted);letter-spacing:.1em;font-size:12px;text-transform:uppercase">No. order anda</div>
    <div class="big num">#${String(myOrder.no).padStart(3, "0")}</div>
    ${o ? `<div style="margin-top:6px;color:var(--muted)">Takeaway · ${esc(o.name)} · ${rm(o.total)}</div>` : ""}
    ${st === "cancel" ? "" : `<div class="steps">${STEPS.map((s, i) => `<div class="${i <= idx ? "on" : ""}">${s[1]}</div>`).join("")}</div>`}
    <p style="margin:6px 0 18px">${msg}</p>
    <button class="btn" id="again">Buat order baru</button></div>`;
  $("#again").onclick = () => { unwatch && unwatch(); myOrder = null; myOrderData = null; ls.set("sips.myorder", null); render(); };
  updateCartBar();
}

render();
startWatch();
</script>
</body>
</html>
